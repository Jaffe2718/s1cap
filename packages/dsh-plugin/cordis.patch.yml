# dsh-s1cap — loader patch for DeepSeek Harness profiles.
#
# `dsh plugin --profile <p> add link:./packages/dsh-plugin` appends this bundle to
# dsh.profile.bundles and composes the insert row below (plugin id: s1cap).
# Every field mirrors packages/core AssemblyPolicy (docs/AGENT_BRIEF.md §4).
#
# SAFETY: the row ships disabled and the plugin ships inert (`enabled: false`), so registering the
# bundle changes nothing by itself. Flip `disabled` and `enabled` together, and only after a sandbox
# profile has shown the plugin activating cleanly — an unverified lifecycle hook once killed a live
# round (docs/AGENT_BRIEF.md §1.8).
- insert:
    - id: s1cap
      name: dsh-s1cap
      disabled: true
      config:
        # master switch: anything but true keeps apply() from registering hooks, commands or clients
        enabled: false
        # M1 observation mode - log runs SEGMENTER/RECALL/ASSEMBLER on every LLM call and records the
        # result in the control-plane log with the prompt left untouched; off disables it. Rewriting the
        # model view is a later, separate switch that does not exist yet.
        observation: log
        # ablation cell: C0 baseline | C1 +TAS | C2 full
        cell: C2
        # Who owns the agent loop. Literal, not a toggle: the harness stops when the model
        # stops and S1CAP can neither prolong nor veto that (docs/ARCHITECTURE.md §4).
        termination: model-owned
        # Hard deadline for the synchronous per-call assembly hook; on expiry the LLM call
        # proceeds unmodified instead of waiting for S1CAP.
        assemblyDeadlineMs: 250
        # Association-graph upkeep is asynchronous: new events are scored off the critical
        # path and merged afterwards, so the graph may lag the session by maxLagTurns.
        rgMaintenance:
          mode: async
          maxLagTurns: 2
        # A selected context only keeps the prefix-cache discount while the SELECTION is stable:
        # a prompt that changes in the middle loses the discount on everything after the change.
        # perTask freezes the selection inside a task; threshold re-selects only when the
        # positional/amortized break-even test pays (packages/core/src/cache-policy.ts).
        cache:
          reselectPolicy: perTask
          blockTokens: 64
        tas:
          on: true
          tMaxChars: 8000
          # perTask keeps the state proxy byte-stable inside a task (cache-friendly)
          updatePolicy: perTask
        recall:
          # τ is `recall.threshold`; this line used to spell it `tau`, which is not a config path and warned as an
          # unknown key on every load. 0.55 is the default, so the value is not restated here.
          depth: 2
          fanout: 8
          # tier1: s1 (one batched `noul` call — the implemented mode) | off. The designed third mode, `embed`
          # (local embedding + ANN top-k), is NOT implemented: no embedder exists and `source: "embed"` is never
          # written to an edge, so `validatePolicy` rejects the literal `embed` rather than reading it as "not off"
          # (packages/core/src/config.ts, `LEGACY_TIER1`).
          tier1: s1
          # "" = not set. Kept because it is the embed mode's model name and that mode is not implemented: a
          # non-empty value here names a model nothing loads, and `validatePolicy` warns about it.
          embedModel: ""
          budgetRatio: 0.35
          # `recall.minRecalledShare` is absent on purpose: the default is 0, and at 0.25 the token-share floor
          # fired on 9 of 9 steps of a live run and replaced every System-1 selection with recency.
        tail:
          k: 3
        planGate:
          on: true
          maxPlans: 3
          attemptCap: 2
          abstainConfidence: 0.5
        s1:
          # jev | laya-serve | edgejev | kev | none — EXACTLY ONE backend is active at a time:
          # enabling Laya while selecting a cloud provider is a config error, not a priority rule
          provider: jev
          # "" = provider default; for laya-serve it follows the Laya runtime's host/port
          baseUrl: ""
          # "" = provider default (jev-latest | laya-typed-decisions | ...) or the Laya checkpoint name
          model: ""
          # "" = read TYPESAFE_API_KEY (jev) or S1CAP_API_KEY from the environment. Never logged:
          # /s1 status prints a redacted fingerprint only.
          apiKey: ""
          questionsPerCall: 20
          # Attempts for one *refused* System-1 call. Laya answers `503 server busy` with `Retry-After` at its
          # admission limit and never queues (docs/LAYA_RUNTIME.md §6b), which cost a measured round 39% of its
          # calls. 1 is a single attempt — what this was before the option existed — and the choice is recorded:
          # every call writes `attempts`/`waitedMs` into its `s1_call` record. Only a refusal is retried, never a
          # timeout, because repeating a refusal costs one wait and repeating a timeout costs another timeout.
          retryAttempts: 1
        # Local Laya backend (docs/LAYA_RUNTIME.md). Enable after installing the
        # serving extra in the target environment: <python> -m pip install "laya[serve]".
        # Machine-specific paths (condaPath, pythonPath) belong in the DSH profile patch.
        laya:
          enabled: false
          pythonPath: ""
          condaEnv: ""
          condaPath: ""
          extraCandidates: []
          preferConsoleScript: true
          serveCommand: ""
          serveArgs: []
          host: 127.0.0.1
          port: 8008
          # readiness probe of laya-serve (verified: GET /health); Jev-style servers use /v1/models and are tried as a fallback
          healthPath: /health
          # checkpoint name or alias: english | multilingual | typed-decisions ("" lets the router decide)
          model: ""
          autoStart: true
          startupTimeoutMs: 120000
          pollIntervalMs: 500
          env: {}
        # TWO SEPARATE STREAMS — never merge them (docs/CONTROL_PLANE_LOGGING.md).
        # Control-plane records are never segmented, never indexed in the association
        # graph and never sent to System-1 as state; otherwise System-1 would end up
        # scoring its own log and the call count would compound every turn.
        telemetry:
          # harness events (append-only) — the only source of segments
          sessionJsonl: ./.s1cap/session.jsonl
          # LLM/S1/tool calls, assembly, gate decisions — humans and analysis only
          controlJsonl: ./.s1cap/control.jsonl
